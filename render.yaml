services:
  - type: web
    name: sigo-dental
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sigo-dental-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MFA_SECRET
        generateValue: true
      - key: MFA_DEMO_CODE
        sync: false
      - key: CONSENT_OTP
        sync: false
      - key: STATIC_DIR
        value: /app/static

databases:
  - name: sigo-dental-db
    plan: free
    databaseName: sigodental
    user: sigodental
    postgresMajorVersion: "16"
    region: oregon
    ipAllowList: []
